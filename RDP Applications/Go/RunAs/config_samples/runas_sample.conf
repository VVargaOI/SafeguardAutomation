# Required: path to the application executable.
# mode=p  ->  appPath is a direct filesystem path to the exe
# mode=e  ->  appPath is the name of an environment variable whose value is the exe path
mode=p
appPath=<full-path-to-your>.exe

# Optional: arguments passed to the application.
# Supports {StdinKey} placeholders replaced at runtime with values from the Launcher STDIN JSON.
# Common placeholders: {Target.AssetNetworkAddress}, {Target.AccountName}, {Target.AccountDomainName}
# WARNING: do NOT include {password} here — it would appear in the child process command line
#          and be visible to other processes via the Windows API.
#          This script of for launching desktop applications with Windows Authentication
#appArgs=--sampleServer {Target.AssetNetworkAddress}

# Optional: write the raw STDIN JSON (including credentials) to the log file.
# Enable only for troubleshooting; disable in production.
#dumpStdinToLog=false
